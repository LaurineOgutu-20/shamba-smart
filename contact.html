<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shamba Smart | Contact</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- NAVIGATION -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🌱 SHAMBA SMART
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="crops.html">
                        Crops
                    </a>
                </li>

                <li>
                    <a href="pests.html">
                        Pests
                    </a>
                </li>

                <li>
                    <a href="diseases.html">
                        Diseases
                    </a>
                </li>

                <li>
                    <a href="seasons.html">
                        Farming Seasons
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CONTACT INTRO -->

    <section class="page-hero">

        <p class="small-title">
            GET IN TOUCH
        </p>

        <h1>
            Contact Shamba Smart
        </h1>

        <p>
            Have a question about crops, pests,
            diseases or farming seasons?
            Send us a message.
        </p>

    </section>


    <!-- CONTACT FORM -->

    <section class="features">

        <div class="contact-form">

            <h2>
                📩 Send Us a Message
            </h2>

            <br>


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
            >

            <small id="nameError"></small>


            <!-- EMAIL -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >

            <small id="emailError"></small>


            <!-- PHONE -->

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >

            <small id="phoneError"></small>


            <!-- SUBJECT -->

            <label for="subject">
                Subject
            </label>

            <select id="subject">

                <option value="">
                    -- Select Subject --
                </option>

                <option value="crops">
                    Crops
                </option>

                <option value="pests">
                    Pests
                </option>

                <option value="diseases">
                    Diseases
                </option>

                <option value="seasons">
                    Farming Seasons
                </option>

                <option value="other">
                    Other
                </option>

            </select>

            <small id="subjectError"></small>


            <!-- MESSAGE -->

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Write your message here..."
            ></textarea>

            <small id="messageError"></small>


            <!-- SUBMIT -->

            <button
                type="button"
                id="submitButton"
            >
                Send Message
            </button>


            <!-- FORM RESULT -->

            <p id="formResult"></p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Shamba Smart |
            Smart Agriculture for Better Farming
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
